<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4338ca">
    <meta name="description" content="Gestor de tareas con Vue 3, Express, Prisma y PostgreSQL">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Gestor de Tareas</title>
    <style>html[data-tema='oscuro'] body { background: #0f1226; }</style>
    <script>
      // Aplica el tema guardado antes de pintar (evita el parpadeo blanco)
      try {
        var g = localStorage.getItem('tema')
        var oscuro = g ? g === 'oscuro' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
